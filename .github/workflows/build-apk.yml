name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Add camera permission
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = [
              '<uses-permission android:name="android.permission.CAMERA" />\n',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n',
          ]
          for perm in perms:
              name = perm.split('"')[1]
              if name not in content:
                  content = content.replace('</manifest>', f'    {perm}</manifest>')
          with open(path, 'w') as f:
              f.write(content)
          EOF

      - name: Register as an external "Capture Image" target
        run: |
          mkdir -p android/app/src/main/java/com/duallens/camera
          cp native-patches/CaptureBridgePlugin.java android/app/src/main/java/com/duallens/camera/CaptureBridgePlugin.java
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/java/com/duallens/camera/MainActivity.java"
          with open(path) as f:
              content = f.read()

          if 'registerPlugin(CaptureBridgePlugin.class)' not in content:
              if re.search(r'void\s+onCreate\s*\(', content):
                  # There's already an onCreate — register the plugin as its first line.
                  content = re.sub(
                      r'(void\s+onCreate\s*\([^)]*\)\s*\{)',
                      r'\1\n        registerPlugin(CaptureBridgePlugin.class);',
                      content, count=1
                  )
              else:
                  # No onCreate yet — generate the whole file fresh.
                  content = (
                      "package com.duallens.camera;\n\n"
                      "import android.os.Bundle;\n"
                      "import com.getcapacitor.BridgeActivity;\n\n"
                      "public class MainActivity extends BridgeActivity {\n"
                      "    @Override\n"
                      "    public void onCreate(Bundle savedInstanceState) {\n"
                      "        registerPlugin(CaptureBridgePlugin.class);\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "    }\n"
                      "}\n"
                  )
              if 'import android.os.Bundle;' not in content:
                  content = content.replace('package com.duallens.camera;\n', 'package com.duallens.camera;\n\nimport android.os.Bundle;\n', 1)

          with open(path, 'w') as f:
              f.write(content)
          EOF
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          extra_filter = (
              '<intent-filter>\n'
              '                <action android:name="android.media.action.IMAGE_CAPTURE" />\n'
              '                <category android:name="android.intent.category.DEFAULT" />\n'
              '            </intent-filter>\n'
          )
          if 'IMAGE_CAPTURE' not in content:
              content = content.replace('</activity>', f'    {extra_filter}</activity>', 1)
          with open(path, 'w') as f:
              f.write(content)
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dual-lens-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
