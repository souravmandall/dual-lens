name: Generate Android APK Safely

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Web Code
      uses: actions/checkout@v4

    - name: Set up Node.js Env
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize App Framework Packages
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli

    - name: Build Capacitor Manifest Configuration
      run: |
        npx cap init "My App" "com.example.myapp" --web-dir=. --confirm

    - name: Bind Core Native Android Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Inject Secure Camera and File Permissions
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_PATH
        fi

    - name: Install Android Hardware Camera Support Plugins
      run: |
        npm install @capacitor/camera @capacitor/filesystem
        npx cap sync android

    - name: Setup Compiler Java Environment (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Deploy Google Android Command SDK Tools
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission for Gradle
      run: |
        cd android
        chmod +x gradlew

    - name: Final Code Compilation Android Build Run
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Release Download Link Generation
      uses: actions/upload-artifact@v4
      with:
        name: complete-android-apk-package
        path: android/app/build/outputs/apk/debug/app-debug.apk
